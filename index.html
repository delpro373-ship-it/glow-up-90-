<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>Glow Up 90</title><style>body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}main{max-width:700px;margin:auto;padding:20px}.card{background:#1d1d1f;border-radius:18px;padding:18px;margin:14px 0}.row{display:flex;gap:10px;align-items:center;margin:13px 0}input{width:22px;height:22px}.bar{height:10px;background:#fff;width:0;border-radius:10px}.track{height:10px;background:#333;border-radius:10px}button{padding:11px 15px;border:0;border-radius:12px;font-weight:bold}small{color:#aaa}</style></head><body><main><h1>🔥 Glow Up 90</h1><p>90 días para construir una mejor versión de ti.</p><div class="card"><h2>📅 Progreso</h2><div class="track"><div id="bar" class="bar"></div></div><p id="day">Día 1 de 90</p><button onclick="completeDay()">Completar día</button></div><div class="card"><h2>🌅 Mañana</h2><label class="row"><input type="checkbox" data-k="wake"> Levantarme sin quedarme pegado al teléfono</label><label class="row"><input type="checkbox" data-k="hygiene"> Higiene y arreglo personal</label><label class="row"><input type="checkbox" data-k="posture"> 10 min de postura/movilidad</label><label class="row"><input type="checkbox" data-k="mind"> ¿Qué tipo de hombre quiero ser hoy?</label></div><div class="card"><h2>💪 Cuerpo</h2><label class="row"><input type="checkbox" data-k="train"> Entrenamiento o actividad física</label><label class="row"><input type="checkbox" data-k="food"> Comí de forma más ordenada</label></div><div class="card"><h2>🧠 Mente</h2><label class="row"><input type="checkbox" data-k="study"> Estudié al menos 30 minutos</label><label class="row"><input type="checkbox" data-k="phone"> Controlé el tiempo en el teléfono</label><label class="row"><input type="checkbox" data-k="calm"> Pensé antes de reaccionar</label></div><div class="card"><h2>🗣️ Comunicación</h2><label class="row"><input type="checkbox" data-k="speak"> Practiqué hablar claro y despacio 10 min</label><label class="row"><input type="checkbox" data-k="listen"> Escuché antes de responder</label></div><div class="card"><h2>🌙 Noche</h2><label class="row"><input type="checkbox" data-k="review"> Revisé cómo me fue hoy</label><p><small>“No busco motivación. Busco repetición.”</small></p><p><small>PAUSA → RESPIRA → PIENSA → RESPONDE.</small></p></div></main><script>const c=[...document.querySelectorAll('input')];c.forEach(x=>{let k='g_'+x.dataset.k;x.checked=localStorage.getItem(k)==='1';x.onchange=()=>localStorage.setItem(k,x.checked?'1':'0')});let d=+localStorage.getItem('day')||1;function render(){day.textContent='Día '+d+' de 90';bar.style.width=(d/90*100)+'%'}function completeDay(){d=Math.min(90,d+1);localStorage.setItem('day',d);c.forEach(x=>{x.checked=false;localStorage.removeItem('g_'+x.dataset.k)});render()}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js')</script></body></html>
